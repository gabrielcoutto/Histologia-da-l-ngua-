<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Língua Histológica 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090711;color:#fff;font-family:Arial,sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090711;z-index:5;font-size:18px}.loading.hide{display:none}.error{max-width:330px;text-align:center;padding:24px;line-height:1.5}.panel{position:fixed;left:12px;top:12px;z-index:3;width:min(290px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;background:rgba(15,10,25,.9);border:1px solid #4d3b63;border-radius:14px;padding:12px;box-sizing:border-box}.panel h1{font-size:18px;margin:0 0 8px}.btn{width:100%;border:0;border-radius:9px;padding:10px;margin:4px 0;background:#2a2038;color:white;text-align:left}.btn:active{transform:scale(.98)}#info{position:fixed;right:12px;bottom:12px;z-index:3;width:min(310px,calc(100vw - 24px));background:rgba(15,10,25,.92);border:1px solid #4d3b63;border-radius:14px;padding:14px;box-sizing:border-box;display:none}.hint{font-size:12px;opacity:.7;margin-top:8px}</style></head><body><div id="app"></div><div id="loading" class="loading">Carregando modelo histológico…</div><div class="panel"><h1>🧫 Língua Histológica 3D</h1><button class="btn" data-part="epitelio">Epitélio estratificado pavimentoso</button><button class="btn" data-part="lamina">Lâmina própria</button><button class="btn" data-part="musculo">Músculo estriado esquelético</button><button class="btn" data-part="filiforme">Papilas filiformes</button><button class="btn" data-part="fungiforme">Papilas fungiformes</button><button class="btn" data-part="circum">Papilas circunvaladas</button><button class="btn" data-part="foliadas">Papilas foliadas</button><button class="btn" data-part="gustativas">Botões gustativos</button><button class="btn" data-part="ebner">Glândulas de Von Ebner</button><button class="btn" data-part="linguais">Glândulas linguais</button><button class="btn" data-part="vasos">Vasos sanguíneos</button><button class="btn" data-part="nervos">Fibras nervosas</button><button class="btn" id="reset">↻ Recentrar</button><div class="hint">Arraste para girar • pinça para zoom • toque nas estruturas</div></div><div id="info"></div><script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script><script>if(!window.THREE){var s=document.createElement('script');s.src='https://unpkg.com/three@0.149.0/build/three.min.js';document.head.appendChild(s)}function boot(){if(!window.THREE){setTimeout(boot,50);return}try{const T=THREE,app=document.getElementById('app'),load=document.getElementById('loading'),info=document.getElementById('info');let scene=new T.Scene(),camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,3,14);let renderer;try{renderer=new T.WebGLRenderer({antialias:true,alpha:false})}catch(e){load.innerHTML='<div class="error">Seu navegador não conseguiu iniciar o WebGL. Abra o projeto no Safari atualizado e verifique se o JavaScript está ativado.</div>';return}renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);app.appendChild(renderer.domElement);scene.background=new T.Color(0x090711);scene.add(new T.AmbientLight(0xffffff,.75));let l=new T.DirectionalLight(0xffffff,1.3);l.position.set(4,8,10);scene.add(l);let root=new T.Group();scene.add(root);const mats={musculo:new T.MeshStandardMaterial({color:0xb84f67,roughness:.8}),lamina:new T.MeshStandardMaterial({color:0xe8a0aa,transparent:true,opacity:.8}),epitelio:new T.MeshStandardMaterial({color:0xf3c1ca}),filiforme:new T.MeshStandardMaterial({color:0xd87c8d}),fungiforme:new T.MeshStandardMaterial({color:0xff8fa2}),circum:new T.MeshStandardMaterial({color:0xffa8b6}),foliadas:new T.MeshStandardMaterial({color:0xef7187}),gustativas:new T.MeshStandardMaterial({color:0xffe58a}),ebner:new T.MeshStandardMaterial({color:0x8dd8ff}),linguais:new T.MeshStandardMaterial({color:0xb4e0ff}),vasos:new T.MeshStandardMaterial({color:0xd72e48}),nervos:new T.MeshStandardMaterial({color:0xf4cf65})};let parts={};function add(name,obj){obj.userData.part=name;root.add(obj);(parts[name]??=[]).push(obj)}function ell(name,sy,sz,mat){let g=new T.SphereGeometry(1,48,24),m=new T.Mesh(g,mats[mat]);m.scale.set(4.8,sy,sz);m.position.y=.2;add(name,m)}ell('musculo',2.05,2.2,'musculo');ell('lamina',2.18,2.28,'lamina');ell('epitelio',2.3,2.36,'epitelio');function cone(name,x,y,z,r,h,mat){let m=new T.Mesh(new T.ConeGeometry(r, h, 12),mats[mat]);m.position.set(x,y,z);add(name,m)}for(let i=0;i<80;i++){let x=(Math.random()-.5)*8.8,z=(Math.random()-.5)*3.5;cone('filiforme',x,2.65,z,.10,.55,'filiforme')}for(let i=0;i<18;i++){let x=(Math.random()-.5)*7.5,z=(Math.random()-.5)*3.2,m=new T.Mesh(new T.SphereGeometry(.22,16,10),mats.fungiforme);m.position.set(x,2.65,z);add('fungiforme',m)}for(let i=-2;i<=2;i++){let x=i*1.1,m=new T.Mesh(new T.CylinderGeometry(.38,.38,.15,24),mats.circum);m.rotation.x=Math.PI/2;m.position.set(x,2.7,0);add('circum',m)}for(let i=0;i<10;i++){let x=-3.6+i*.8,m=new T.Mesh(new T.CylinderGeometry(.09,.09,.55,12),mats.foliadas);m.rotation.z=Math.PI/2;m.position.set(x,2.55,-2.05);add('foliadas',m)}for(let i=0;i<28;i++){let x=(Math.random()-.5)*7,z=(Math.random()-.5)*3,m=new T.Mesh(new T.SphereGeometry(.08,10,8),mats.gustativas);m.position.set(x,2.85,z);add('gustativas',m)}for(let i=0;i<18;i++){let m=new T.Mesh(new T.SphereGeometry(.14,12,8),mats.ebner);m.position.set((Math.random()-.5)*5,-.5,(Math.random()-.5)*2);add('ebner',m)}for(let i=0;i<18;i++){let m=new T.Mesh(new T.SphereGeometry(.13,12,8),mats.linguais);m.position.set((Math.random()-.5)*7,-.8,(Math.random()-.5)*2);add('linguais',m)}function cyl(name,x,y,z,r,len,rot,mat){let m=new T.Mesh(new T.CylinderGeometry(r,r,len,10),mats[mat]);m.position.set(x,y,z);m.rotation.set(rot[0],rot[1],rot[2]);add(name,m)}for(let i=0;i<8;i++)cyl('vasos',(Math.random()-.5)*5,-.2,(Math.random()-.5)*2,.07,3,[0,0,Math.PI/2], 'vasos');for(let i=0;i<8;i++)cyl('nervos',(Math.random()-.5)*5,.1,(Math.random()-.5)*2,.045,3,[0,.5,.5], 'nervos');for(let i=0;i<35;i++)cyl('musculo',(Math.random()-.5)*7,-.2,(Math.random()-.5)*3,.025,2,[0,0,Math.PI/2], 'musculo');const text={epitelio:['Epitélio estratificado pavimentoso','Revestimento da língua; protege o tecido subjacente e pode apresentar queratinização variável.'],lamina:['Lâmina própria','Tecido conjuntivo logo abaixo do epitélio, com vasos, nervos e estruturas glandulares.'],musculo:['Músculo estriado esquelético','Forma a maior parte do corpo da língua; suas fibras permitem movimentos voluntários em diferentes direções.'],filiforme:['Papilas filiformes','São numerosas, finas e geralmente queratinizadas. Sua principal função é mecânica; não possuem botões gustativos.'],fungiforme:['Papilas fungiformes','Mais arredondadas, espalhadas entre as filiformes e associadas a botões gustativos.'],circum:['Papilas circunvaladas','Grandes papilas próximas ao sulco terminal, cercadas por um sulco profundo e com muitos botões gustativos nas paredes laterais.'],foliadas:['Papilas foliadas','Pregas laterais da língua, especialmente evidentes na região posterior-lateral, contendo botões gustativos.'],gustativas:['Botões gustativos','Estruturas sensoriais intraepiteliais formadas por células gustativas e de suporte, responsáveis pela percepção do sabor.'],ebner:['Glândulas de Von Ebner','Glândulas serosas associadas principalmente às papilas circunvaladas; sua secreção ajuda a lavar os sulcos.'],linguais:['Glândulas linguais','Glândulas salivares menores presentes na língua, com porções secretoras e ductos.'],vasos:['Vasos sanguíneos','Encontrados no tecido conjuntivo e entre os feixes musculares, levando oxigênio e nutrientes.'],nervos:['Fibras nervosas','Presentes no tecido conjuntivo e próximas às estruturas sensoriais, conduzindo informações sensitivas e gustativas.']};function show(p){let t=text[p];if(!t)return;info.innerHTML='<b>'+t[0]+'</b><p>'+t[1]+'</p>';info.style.display='block'}document.querySelectorAll('.btn[data-part]').forEach(b=>b.onclick=()=>show(b.dataset.part));document.getElementById('reset').onclick=()=>{root.rotation.set(0,0,0);camera.position.set(0,3,14)};let down=false,lastX=0,lastY=0,pinch=0;renderer.domElement.onpointerdown=e=>{down=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!down)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;root.rotation.y+=dx*.008;root.rotation.x+=dy*.005;lastX=e.clientX;lastY=e.clientY};renderer.domElement.onpointerup=()=>down=false;renderer.domElement.onpointercancel=()=>down=false;renderer.domElement.onwheel=e=>{camera.position.z=Math.max(7,Math.min(24,camera.position.z+e.deltaY*.01))};let ray=new T.Raycaster(),mouse=new T.Vector2();renderer.domElement.addEventListener('click',e=>{let r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);let hit=ray.intersectObjects(root.children,true)[0];if(hit?.object.userData.part)show(hit.object.userData.part)});function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);load.classList.add('hide');(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)})()}catch(e){document.getElementById('loading').innerHTML='<div class="error">Erro ao montar o modelo: '+(e.message||e)+'</div>'}}boot();</script></body></html>
