<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Língua Histológica 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09070d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#fff}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#09070d;font-size:18px}.loading.hide{display:none}.error{max-width:340px;text-align:center;line-height:1.5;padding:24px}.ui{position:fixed;z-index:5}.top{left:16px;top:14px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{pointer-events:auto;background:rgba(13,9,19,.82);backdrop-filter:blur(12px);border:1px solid rgba(210,158,220,.22);border-radius:15px;padding:12px 15px;box-shadow:0 10px 30px rgba(0,0,0,.3)}.brand b{font-size:17px}.brand small{display:block;margin-top:3px;color:#cbbfd2}.controls{display:flex;gap:8px;pointer-events:auto}.iconbtn{width:44px;height:44px;border:1px solid rgba(255,255,255,.18);background:rgba(13,9,19,.78);color:#fff;border-radius:13px;font-size:20px;backdrop-filter:blur(12px)}.side{left:16px;top:92px;width:280px;max-height:calc(100dvh - 110px);overflow:auto;background:rgba(13,9,19,.86);backdrop-filter:blur(15px);border:1px solid rgba(210,158,220,.22);border-radius:18px;padding:12px;box-shadow:0 18px 45px rgba(0,0,0,.35)}.side h2{font-size:14px;margin:3px 5px 10px;color:#d8c9dc}.btn{width:100%;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:11px 12px;margin:4px 0;background:#21172b;color:#f7f1f8;text-align:left;font-size:14px}.btn:active{transform:scale(.985)}.btn.active{border-color:#d69adf;background:#34213c}.hint{font-size:11px;line-height:1.45;color:#a99daa;margin:10px 5px 2px}.info{right:16px;bottom:16px;width:min(360px,calc(100vw - 32px));background:rgba(13,9,19,.92);backdrop-filter:blur(15px);border:1px solid rgba(210,158,220,.28);border-radius:18px;padding:17px;box-shadow:0 18px 45px rgba(0,0,0,.4);display:none}.info.show{display:block}.info .tag{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#d69adf}.info h3{margin:5px 0 8px;font-size:20px}.info p{margin:0;color:#d8ceda;line-height:1.5;font-size:14px}.badge{position:fixed;z-index:4;right:16px;top:70px;background:rgba(13,9,19,.7);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;font-size:11px;color:#cfc4d1}.legend{position:fixed;right:16px;bottom:16px;transform:translateY(calc(100% + 10px));display:none}.sectionMode .legend{display:block}.legend span{display:inline-block;margin-left:8px;font-size:11px;color:#ddd}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}.mobileOnly{display:none}@media(max-width:760px){.side{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:34dvh;border-radius:16px;padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:5px;overflow:auto}.side h2,.hint{grid-column:1/-1}.btn{margin:0;padding:9px 8px;font-size:12px}.top{left:10px;right:10px}.brand{padding:9px 11px}.brand b{font-size:14px}.brand small{font-size:10px}.controls{gap:5px}.iconbtn{width:40px;height:40px}.badge{top:62px;right:10px}.info{right:10px;left:10px;bottom:calc(34dvh + 20px);width:auto}.mobileOnly{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading" class="loading">Carregando modelo histológico…</div>
<div class="ui top">
  <div class="brand"><b>🧫 Língua Histológica 3D</b><small>Superfície + corte histológico</small></div>
  <div class="controls"><button class="iconbtn" id="sectionBtn" title="Corte histológico">🔬</button><button class="iconbtn" id="reset" title="Recentrar">↻</button></div>
</div>
<div class="badge" id="modeBadge">VISÃO HISTOLÓGICA</div>
<div class="ui side">
  <h2>Estruturas para estudar</h2>
  <button class="btn" data-part="epitelio">Epitélio estratificado</button>
  <button class="btn" data-part="lamina">Lâmina própria</button>
  <button class="btn" data-part="musculo">Músculo estriado esquelético</button>
  <button class="btn" data-part="filiforme">Papilas filiformes</button>
  <button class="btn" data-part="fungiforme">Papilas fungiformes</button>
  <button class="btn" data-part="circum">Papilas circunvaladas</button>
  <button class="btn" data-part="foliadas">Papilas foliadas</button>
  <button class="btn" data-part="gustativas">Botões gustativos</button>
  <button class="btn" data-part="ebner">Glândulas de Von Ebner</button>
  <button class="btn" data-part="linguais">Glândulas linguais</button>
  <button class="btn" data-part="vasos">Vasos sanguíneos</button>
  <button class="btn" data-part="nervos">Fibras nervosas</button>
  <div class="hint">Arraste a língua para girar • pinça para aproximar • toque em uma estrutura ou use os botões para focar nela.</div>
</div>
<div class="info" id="info"><div class="tag">Foco histológico</div><h3 id="infoTitle"></h3><p id="infoText"></p></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
function fallback(){if(window.THREE)return;var s=document.createElement('script');s.src='https://unpkg.com/three@0.149.0/build/three.min.js';s.onload=boot;s.onerror=function(){document.getElementById('loading').innerHTML='<div class="error">Não foi possível carregar o motor 3D. Verifique a internet e recarregue a página.</div>'};document.head.appendChild(s)}
function boot(){if(!window.THREE){setTimeout(boot,40);return}try{
const T=THREE,app=document.getElementById('app'),loading=document.getElementById('loading'),info=document.getElementById('info'),title=document.getElementById('infoTitle'),desc=document.getElementById('infoText');
const scene=new T.Scene();scene.background=new T.Color(0x09070d);
const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,3.2,13.5);
let renderer;try{renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'})}catch(e){loading.innerHTML='<div class="error">O navegador não conseguiu iniciar o WebGL. Tente abrir no Safari atualizado.</div>';return}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);app.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xfff1f5,0x3a243f,1.25));const key=new T.DirectionalLight(0xffffff,1.5);key.position.set(4,8,8);scene.add(key);const fill=new T.DirectionalLight(0xffb7d1,.55);fill.position.set(-6,3,2);scene.add(fill);
const root=new T.Group();scene.add(root);const surface=new T.Group();root.add(surface);const inside=new T.Group();root.add(inside);
const mats={musculo:new T.MeshStandardMaterial({color:0xb64f68,roughness:.88}),muscle2:new T.MeshStandardMaterial({color:0x8f354e,roughness:.9}),epitelio:new T.MeshStandardMaterial({color:0xf1c4cb,roughness:.65}),papilla:new T.MeshStandardMaterial({color:0xd96f83,roughness:.72}),fungiforme:new T.MeshStandardMaterial({color:0xf39aaa,roughness:.6}),circum:new T.MeshStandardMaterial({color:0xffb1bf,roughness:.55}),foliadas:new T.MeshStandardMaterial({color:0xe77b91,roughness:.7}),gosto:new T.MeshStandardMaterial({color:0xffe18a,roughness:.5}),ebner:new T.MeshStandardMaterial({color:0x8fd6e7,roughness:.6}),lingual:new T.MeshStandardMaterial({color:0x9ec9e8,roughness:.6}),vaso:new T.MeshStandardMaterial({color:0xb51e45,roughness:.5}),nervo:new T.MeshStandardMaterial({color:0xf2cf67,roughness:.6}),trench:new T.MeshBasicMaterial({color:0x8f4658,side:T.DoubleSide}),outline:new T.LineBasicMaterial({color:0xffd4df})};
const parts={};function add(part,obj,group){obj.userData.part=part;(group||surface).add(obj);(parts[part]||(parts[part]=[])).push(obj);return obj}
// Anatomical tongue body: tapered, slightly curved ellipsoid-like surface
const bodyGeo=new T.SphereGeometry(1,64,36);bodyGeo.translate(0,0,0);const pos=bodyGeo.attributes.position;for(let i=0;i<pos.count;i++){let x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);let t=(x+1)/2;let width=.70+.30*t;pos.setXYZ(i,x*4.65,y*1.05+0.18*(1-x*x),z*2.18*width)}bodyGeo.computeVertexNormals();const body=add('musculo',new T.Mesh(bodyGeo,mats.musculo),surface);body.position.y=.05;
// Thin histological layers visible as nested shells at the superior surface
const epiGeo=new T.SphereGeometry(1,64,36);const ep=epiGeo.attributes.position;for(let i=0;i<ep.count;i++){let x=ep.getX(i),y=ep.getY(i),z=ep.getZ(i);let top=Math.max(y,0);let t=(x+1)/2;let width=.70+.30*t;ep.setXYZ(i,x*4.69,(y*1.05+0.18*(1-x*x))+.075*top,z*2.20*width)}epiGeo.computeVertexNormals();const epi=add('epitelio',new T.Mesh(epiGeo,mats.epitelio),surface);epi.position.y=.08;
// Lamina propria as a thin ridge-like layer under epithelium, visible in section mode.
const lamGeo=new T.SphereGeometry(1,64,36);const lp=lamGeo.attributes.position;for(let i=0;i<lp.count;i++){let x=lp.getX(i),y=lp.getY(i),z=lp.getZ(i);let t=(x+1)/2;let width=.70+.30*t;lp.setXYZ(i,x*4.66,(y*1.05+0.18*(1-x*x))+.02,z*2.19*width)}lamGeo.computeVertexNormals();const lam=add('lamina',new T.Mesh(lamGeo,mats.lamina),inside);lam.visible=false;lam.position.y=.06;
// Papillae arranged anatomically on the dorsal surface.
function surfaceY(x,z){let xn=x/4.65;let width=2.18*(.70+.30*((xn+1)/2));let zz=Math.max(-.999,Math.min(.999,z/width));return .05+1.05*Math.sqrt(Math.max(0,1-xn*xn-zz*zz))+0.18*(1-xn*xn)+.12}
function cone(part,x,z,r,h,mat){let m=add(part,new T.Mesh(new T.ConeGeometry(r,h,12),mat),surface);m.position.set(x,surfaceY(x,z)+h*.45,z);return m}
// Filiform: many small keratinized pointed papillae, anterior 2/3
for(let i=0;i<115;i++){let x=-3.65+Math.random()*6.0;let maxZ=2.0*(.73+.27*((x/4.65+1)/2));let z=(Math.random()*2-1)*maxZ*.82;cone('filiforme',x,z,.045+Math.random()*.035,.22+Math.random()*.18,mats.papilla)}
// Fungiform: fewer rounded papillae, mostly anterior and lateral
for(let i=0;i<23;i++){let x=-3.9+Math.random()*6.5;let maxZ=2.05*(.72+.28*((x/4.65+1)/2));let z=(Math.random()*2-1)*maxZ*.92;let m=add('fungiforme',new T.Mesh(new T.SphereGeometry(.13+Math.random()*.045,18,12),mats.fungiforme),surface);m.position.set(x,surfaceY(x,z)+.11,z)}
// Circumvallate papillae in a V-shaped row, posterior to the sulcus terminalis.
for(let i=0;i<9;i++){let q=(i-4)/4;let x=1.15+Math.abs(q)*.72;let z=q*1.22;let y=surfaceY(x,z)+.10;let p=add('circum',new T.Mesh(new T.CylinderGeometry(.27,.31,.13,28),mats.circum),surface);p.position.set(x,y,z);let trench=add('circum',new T.Mesh(new T.TorusGeometry(.38,.055,10,28),mats.trench),surface);trench.rotation.x=Math.PI/2;trench.position.set(x,y-.01,z)}
// Foliate papillae: parallel lateral folds posteriorly.
for(let side of [-1,1])for(let i=0;i<6;i++){let x=2.45+i*.23;let z=side*(1.62+.02*i);let y=surfaceY(x,z)+.05;let r=add('foliadas',new T.Mesh(new T.BoxGeometry(.10,.20,.055),mats.foliadas),surface);r.position.set(x,y,z);r.rotation.y=.05}
// Taste buds are represented in the sectional microscopic view, not randomly over the surface.
function makeTasteBud(x,y,z,rot){let g=new T.Group();let outer=new T.Mesh(new T.SphereGeometry(.09,14,10),mats.gosto);outer.scale.set(.7,1.5,.7);g.add(outer);g.position.set(x,y,z);g.rotation.z=rot;add('gustativas',g,inside);return g}
for(let i=0;i<22;i++){let x=-1.2+Math.random()*2.5;let z=(Math.random()*2-1)*.9;makeTasteBud(x,1.05+Math.random()*.35,z,(Math.random()-.5)*.6)}
// Von Ebner serous acini and ducts under circumvallate region
for(let i=0;i<22;i++){let a=Math.random()*Math.PI*2,r=.35+Math.random()*1.4,x=1.1+r*Math.cos(a),z=r*Math.sin(a);let m=add('ebner',new T.Mesh(new T.SphereGeometry(.10+Math.random()*.035,12,8),mats.ebner),inside);m.position.set(x,-.05,z)}
// Lingual glands posterior/inferior
for(let i=0;i<30;i++){let x=.4+Math.random()*3.1,z=(Math.random()*2-1)*1.3;let m=add('linguais',new T.Mesh(new T.SphereGeometry(.10+Math.random()*.05,12,8),mats.lingual),inside);m.position.set(x,-.15,z)}
// Skeletal muscle bundles, vessels and nerves only in sectional view
function cyl(part,x,y,z,r,len,mat,rx,ry,rz){let m=add(part,new T.Mesh(new T.CylinderGeometry(r,r,len,10),mat),inside);m.position.set(x,y,z);m.rotation.set(rx||0,ry||0,rz||0);return m}
for(let i=0;i<24;i++){let x=-3.5+Math.random()*6.8,z=(Math.random()*2-1)*1.7;cyl('musculo',x,-.2,z,.055,1.7,mats.muscle2,0,0,Math.PI/2)}
for(let i=0;i<9;i++){let x=-2.5+Math.random()*5,z=(Math.random()*2-1)*1.1;cyl('vasos',x,.25,z,.045,1.8,mats.vaso,0,.4,.5)}
for(let i=0;i<9;i++){let x=-2.5+Math.random()*5,z=(Math.random()*2-1)*1.1;cyl('nervos',x,.35,z,.035,1.7,mats.nervo,.2,.7,.3)}
// Section overlay plane on the right: a stylized histological field with layers and structures.
const section=new T.Group();root.add(section);section.visible=false;const bg=new T.Mesh(new T.PlaneGeometry(6.5,5.0),new T.MeshBasicMaterial({color:0x211724,side:T.DoubleSide}));bg.position.set(3.8,1.8,-.8);section.add(bg);
function secRect(x,y,w,h,mat){let m=new T.Mesh(new T.PlaneGeometry(w,h),mat);m.position.set(x,y,-.72);section.add(m);return m}
secRect(3.8,3.25,6.1,.38,mats.epitelio);secRect(3.8,2.55,6.1,.95,new T.MeshBasicMaterial({color:0xd79ca8}));secRect(3.8,1.0,6.1,2.1,mats.musculo);
for(let i=0;i<18;i++){let x=1.0+Math.random()*5.6,y=1.65+Math.random()*1.25;let g=new T.Mesh(new T.SphereGeometry(.065,10,8),mats.gosto);g.scale.set(.65,1.5,.65);g.position.set(x,y,-.68);section.add(g)}
// text labels in section view using canvas sprites
function label(txt,x,y){let c=document.createElement('canvas');c.width=512;c.height=80;let ctx=c.getContext('2d');ctx.fillStyle='rgba(9,7,13,.78)';ctx.roundRect?.(4,8,504,64,16);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 27px Arial';ctx.fillText(txt,22,50);let tex=new T.CanvasTexture(c);let s=new T.Sprite(new T.SpriteMaterial({map:tex,transparent:true}));s.scale.set(2.8,.44,1);s.position.set(x,y,-.55);section.add(s)}
label('Epitélio',3.8,3.75);label('Lâmina própria',3.8,2.85);label('Músculo estriado',3.8,.15);label('Botões gustativos',3.8,1.95);
const text={
 epitelio:['Epitélio estratificado pavimentoso','Revestimento da língua. Nas áreas sujeitas a atrito, pode apresentar maior queratinização, especialmente nas papilas filiformes.'],
 lamina:['Lâmina própria','Tecido conjuntivo situado logo abaixo do epitélio, contendo vasos, nervos e estruturas glandulares.'],
 musculo:['Músculo estriado esquelético','Constitui a maior parte da língua. Os feixes musculares se cruzam em diferentes direções e permitem movimentos voluntários.'],
 filiforme:['Papilas filiformes','São as mais numerosas e finas. Geralmente queratinizadas e com função principalmente mecânica. Não apresentam botões gustativos.'],
 fungiforme:['Papilas fungiformes','Possuem formato de cogumelo e aparecem entre as filiformes. Podem conter botões gustativos no epitélio.'],
 circum:['Papilas circunvaladas','Grandes papilas organizadas em uma fileira em V. Apresentam sulcos profundos e muitos botões gustativos nas paredes laterais.'],
 foliadas:['Papilas foliadas','Pregas paralelas na região posterolateral da língua. Podem conter numerosos botões gustativos.'],
 gustativas:['Botões gustativos','Estruturas sensoriais intraepiteliais formadas por células gustativas e de suporte, relacionadas à percepção dos sabores.'],
 ebner:['Glândulas de Von Ebner','Glândulas serosas associadas às papilas circunvaladas. Sua secreção ajuda a limpar os sulcos e renovar o contato dos estímulos gustativos.'],
 linguais:['Glândulas linguais','Glândulas salivares menores da língua, encontradas em diferentes regiões e associadas a ductos e unidades secretoras.'],
 vasos:['Vasos sanguíneos','Localizados no tecido conjuntivo e entre os feixes musculares, levando oxigênio e nutrientes aos tecidos.'],
 nervos:['Fibras nervosas','Encontradas no tecido conjuntivo e próximas às estruturas sensoriais, conduzindo informações sensitivas e gustativas.']
};
function focus(part){let arr=parts[part];if(!arr||!arr.length)return;document.querySelectorAll('.btn').forEach(b=>b.classList.toggle('active',b.dataset.part===part));let target=new T.Vector3();let count=0;arr.forEach(o=>{if(o.getWorldPosition){let p=new T.Vector3();o.getWorldPosition(p);target.add(p);count++}});if(count)target.multiplyScalar(1/count);let distance={epitelio:7.8,lamina:7.4,musculo:8.8,filiforme:7.8,fungiforme:7.6,circum:6.7,foliadas:7.0,gustativas:5.8,ebner:5.8,linguais:6.3,vasos:6.5,nervos:6.5}[part]||7.5;animateFocus(target,distance);title.textContent=text[part][0];desc.textContent=text[part][1];info.classList.add('show')}
let anim=null;function animateFocus(target,d){if(anim)cancelAnimationFrame(anim);let startPos=camera.position.clone(),startTarget=root.userData.look||new T.Vector3(0,1,0);let dir=new T.Vector3().subVectors(startPos,startTarget).normalize();let endPos=target.clone().add(dir.multiplyScalar(d));let t0=performance.now();function step(now){let p=Math.min(1,(now-t0)/650),e=1-Math.pow(1-p,3);camera.position.lerpVectors(startPos,endPos,e);root.userData.look=startTarget.clone().lerp(target,e);camera.lookAt(root.userData.look);if(p<1)anim=requestAnimationFrame(step);else anim=null}anim=requestAnimationFrame(step)}
// Custom orbit + pinch controls
let dragging=false,lastX=0,lastY=0;const pointers=new Map();let pinchStart=0,pinchCamZ=0;
renderer.domElement.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,e);renderer.domElement.setPointerCapture?.(e.pointerId);if(pointers.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY}else if(pointers.size===2){dragging=false;let a=[...pointers.values()];pinchStart=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);pinchCamZ=camera.position.length()}});
renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,e);if(pointers.size===2){let a=[...pointers.values()],d=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);camera.position.multiplyScalar(Math.max(.7,Math.min(1.3,pinchStart/d)));camera.position.clampLength(5.2,18);return}if(!dragging)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;root.rotation.y+=dx*.006;root.rotation.x=Math.max(-.55,Math.min(.65,root.rotation.x+dy*.004));lastX=e.clientX;lastY=e.clientY});
function up(e){pointers.delete(e.pointerId);if(pointers.size===0)dragging=false}renderer.domElement.addEventListener('pointerup',up);renderer.domElement.addEventListener('pointercancel',up);renderer.domElement.addEventListener('wheel',e=>{camera.position.multiplyScalar(1+e.deltaY*.0008);camera.position.clampLength(5.2,18)},{passive:true});
// Touch tap vs drag raycast
let downPoint=null;renderer.domElement.addEventListener('pointerdown',e=>{downPoint={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(!downPoint)return;let moved=Math.hypot(e.clientX-downPoint.x,e.clientY-downPoint.y);downPoint=null;if(moved>10)return;let r=renderer.domElement.getBoundingClientRect(),m=new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),ray=new T.Raycaster();ray.setFromCamera(m,camera);let hit=ray.intersectObjects(root.children,true).find(h=>h.object.userData.part);if(hit)focus(hit.object.userData.part)});
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>focus(b.dataset.part)));
document.getElementById('reset').addEventListener('click',()=>{root.rotation.set(0,0,0);camera.position.set(0,3.2,13.5);root.userData.look=new T.Vector3(0,1,0);info.classList.remove('show');document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'))});
document.getElementById('sectionBtn').addEventListener('click',()=>{section.visible=!section.visible;inside.visible=section.visible;document.body.classList.toggle('sectionMode',section.visible);document.getElementById('modeBadge').textContent=section.visible?'CORTE HISTOLÓGICO':'VISÃO HISTOLÓGICA';if(section.visible){lam.visible=true;surface.children.forEach(o=>{if(o.userData.part==='musculo')o.visible=false})}else{lam.visible=false;surface.children.forEach(o=>o.visible=true);inside.visible=false}});
root.userData.look=new T.Vector3(0,1,0);loading.classList.add('hide');
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)})();
}catch(e){document.getElementById('loading').innerHTML='<div class="error">Erro ao montar o modelo: '+String(e.message||e)+'</div>'}}
if(window.THREE)boot();else{fallback();setTimeout(boot,80)}
})();
</script>
</body>
</html>
